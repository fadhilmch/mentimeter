name: tmp-lockfile-regen
on:
  push:
    branches: [feat/rebuild]
    paths: ['.github/workflows/tmp-cleanup.yml']
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package-lock.json for server and client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd server && npm install --package-lock-only --no-audit --no-fund && cd ..
          cd client && npm install --package-lock-only --no-audit --no-fund && cd ..
          git add server/package-lock.json client/package-lock.json
          git commit -m "chore: regenerate package-lock.json for server and client" || echo "nothing to commit"
          git push origin feat/rebuild
